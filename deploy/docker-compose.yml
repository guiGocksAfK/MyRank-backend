# Produção na VM da Oracle: só a API. O HTTPS fica com o Caddy compartilhado
# (~/infra na VM), que atende todos os projetos da VM pelo domínio de cada um.
# O banco continua no Neon — nada de Postgres aqui.
#
#   cd deploy && docker compose up -d --build
#
# (o docker-compose.yml da raiz é só pro ambiente local, com Postgres próprio)

services:
  api:
    build: ..
    container_name: myrank-api # é por este nome que o Caddy encontra a API
    restart: unless-stopped
    env_file: .env
    environment:
      # Atrás do Caddy: pega o IP real do X-Forwarded-For (Tomcat só confia em
      # proxies de rede interna, ex.: a rede do Docker). Sem isso o RateLimitFilter
      # veria todo mundo com o IP do Caddy.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 4g
    expose:
      - "8080" # só na rede interna; quem fala com a internet é o Caddy
    networks:
      - web

networks:
  web:
    external: true # criada uma vez: docker network create web
