# Produção na VM da Oracle: API + Caddy (HTTPS automático via Let's Encrypt).
# O banco continua no Neon — nada de Postgres aqui.
#
#   cd deploy && docker compose up -d --build
#
# (o docker-compose.yml da raiz é só pro ambiente local, com Postgres próprio)

services:
  api:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      # Atrás do Caddy: pega o IP real do X-Forwarded-For (Tomcat só confia em
      # proxies de rede interna, ex.: a rede do Docker). Sem isso o RateLimitFilter
      # veria todo mundo com o IP do Caddy.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 4g
    expose:
      - "8080" # só na rede interna; quem fala com a internet é o Caddy

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados — não apagar
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
