spring.application.name=MyRank

# Render injeta PORT; localhost usa 8080.
server.port=${PORT:8080}

# Compressão HTTP (Gzip) para payloads JSON maiores que 1KB
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript

# Origens liberadas no CORS (REST) e no handshake do WebSocket — separadas por
# vírgula. Em prod: http://localhost:5173,https://myrank.vercel.app (ajuste a
# URL real do Vercel/domínio quando tiver).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Datasource (env vars sobrescrevem; defaults servem só pro Postgres local de dev)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myrank}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões — o default (10) trava o throughput sob carga; web precisa de mais.
# Load test mostrou teto de ~520 req/s exatamente com 10 conexões.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# As migrations V1–V8 são a consolidação (squash) das 16 antigas, com o mesmo
# schema. Um banco que já rodou as antigas passa pra nova base assim: backup,
# DROP TABLE flyway_schema_history, e subir UMA vez com FLYWAY_BASELINE=true.
# O Flyway marca a V8 como já aplicada e não roda nada. Desligado por padrão:
# ligado sempre, um banco com tabelas e sem histórico seria marcado errado.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:false}
spring.flyway.baseline-version=8
spring.flyway.baseline-description=squash das migrations V1-V16

# Segredo do JWT — SEM default de propósito. Defina a env var JWT_SECRET com um
# valor aleatório de 32+ chars (ex.: `openssl rand -base64 48`). A app não sobe sem isso.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OAuth (Google / Discord)
oauth.google.client-id=${GOOGLE_CLIENT_ID:644864674130-egndgdcs9hq13vga1d70lt8l9j081mki.apps.googleusercontent.com}
oauth.discord.client-id=${DISCORD_CLIENT_ID:1535058453888893010}
oauth.discord.client-secret=${DISCORD_CLIENT_SECRET:}

# Bot de Discord — API key de serviço (X-Bot-Key). SEM default de propósito: vazio
# desativa o BotAuthenticationFilter por completo, para que um deploy sem a env var
# nunca fique com bypass de autenticação aberto. Gere com `openssl rand -hex 32` e
# mantenha só no systemd/env da VM — nunca aqui.
myrank.bot.api-key=${MYRANK_BOT_API_KEY:}

tmdb.api-token=${TMDB_API_TOKEN:}
rawg.api-key=${RAWG_API_KEY:}
google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
# MyAnimeList API oficial — Client ID de https://myanimelist.net/apiconfig
mal.client-id=${MAL_CLIENT_ID:}

# Email transacional (Brevo) — códigos de confirmação, recuperação e exclusão.
# Sem BREVO_API_KEY/MAIL_FROM_EMAIL nada é enviado e o código não aparece nos logs.
# MAIL_FROM_EMAIL precisa ser um remetente verificado no painel do Brevo.
brevo.api-key=${BREVO_API_KEY:}
mail.from-email=${MAIL_FROM_EMAIL:}
mail.from-name=${MAIL_FROM_NAME:MyRank}

# Gemini (IA Insights)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}
# Raciocínio interno do modelo: ligado, a análise levava ~25s; "none" desliga (vazio = não manda).
gemini.api.reasoning-effort=${GEMINI_REASONING_EFFORT:none}
